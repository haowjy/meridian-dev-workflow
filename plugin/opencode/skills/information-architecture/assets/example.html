<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframes: Project notes</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<main>
<h1>Wireframes: Project notes</h1>
<p>Structure only: no colour, type or visual choices. The things, how they nest and where each
one opens are in <a href="information-architecture.md">the information architecture</a>.</p>

<h2>Screens</h2>

<figure>
<figcaption><b>A project, one note open</b>
Decides: the sidebar lists the project's notes, and a note opens as a tab. Open: whether
comments get their own panel or stay under the note.</figcaption>
<div class="wf-screen">
  <div class="wf-rail">
    <div class="wf-rail-item on">Projects</div>
    <div class="wf-rail-item">Inbox</div>
    <div class="wf-spacer"></div>
    <div class="wf-rail-item">Settings</div>
  </div>
  <div class="wf-sidebar">
    <div class="wf-hbox"><span class="wf-title">Garden plan</span><span class="wf-spacer"></span><span class="wf-btn">New note</span></div>
    <div class="wf-input">Search notes</div>
    <div class="wf-label">Needs you</div>
    <div class="wf-item hot">Order seeds<span class="wf-end">due today</span></div>
    <div class="wf-label">Notes</div>
    <div class="wf-item flat on">Bed layout</div>
    <div class="wf-item flat" data-depth="1">North bed</div>
    <div class="wf-item flat" data-depth="1">South bed</div>
    <div class="wf-item flat">Watering</div>
  </div>
  <div class="wf-main">
    <div class="wf-hbox wf-grow">
      <div class="wf-panel focus wf-grow">
        <div class="wf-tabs"><span class="wf-tab on">Bed layout</span><span class="wf-tab">Watering</span></div>
        <div class="wf-body">
          <div class="wf-title">Bed layout</div>
          <div class="wf-hbox"><span class="wf-chip on">Spring</span><span class="wf-chip">Summer</span></div>
          <div class="wf-img" style="height:180px"><span>Plan drawing</span></div>
          <div class="wf-lines"><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="wf-panel" style="width:260px">
        <div class="wf-tabs"><span class="wf-tab on">Comments</span></div>
        <div class="wf-body">
          <div class="wf-item">Ana: move the beans?<span class="wf-end">2</span></div>
          <div class="wf-empty">No other comments</div>
          <div class="wf-input">Reply</div>
        </div>
      </div>
    </div>
  </div>
</div>
</figure>

<h2>Open questions</h2>
<ol>
<li>Do comments get their own panel, or sit under the note? The screen above shows a panel.</li>
</ol>
</main>
</body>
</html>
