[package]
name = "meridian-dev-workflow"
version = "0.16.0"
description = "Opinionated dev team for Meridian — architects, coders, reviewers, testers, and the skills that coordinate them."
requires-mars = ">=0.20.0"
requires-meridian = ">=0.15.0"
schema = 1

[plugin]
description = "A multi-agent development team: leads you work with in a session, the specialists they delegate to, and the skills that carry a change from first edit to merged PR."

[dependencies.meridian-base]
url = "https://github.com/haowjy/meridian-base"
version = ">=0.13.0, <0.14.0"

[local-dependencies.meridian-prompter]
url = "https://github.com/meridian-flow/meridian-prompter"

[settings]
targets = [
    ".codex",
    ".claude",
    ".opencode",
]
models_cache_ttl_hours = 24
